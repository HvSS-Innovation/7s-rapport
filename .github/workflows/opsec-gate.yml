# OPSEC-gate (Fas 3, roadmap-opsec-hardat-lage) — två vakter på varje push:
#
#  1. egress-gate: statiskt skript som failar när serverad kod får en ny
#     extern host, en fetch-host dyker upp i en oregistrerad fil, eller en
#     härdat-spärr (gate-markör) raderas. Konfig: verktyg/egress-gate.js.
#  2. hardened-invariant: Playwright kör hela härdat-kedjan i riktig browser
#     bakom en lokal deny-all-proxy — invarianten "härdat = 0 nätverksegress"
#     bevisas av att proxyloggen är tom. Rigg: test/opsec/.
#
#  Auto-bump-commits ([skip ci]) triggar inte. Actions är SHA-pinnade
#  (mutable tags = supply chain-risk, jfr SECURITY_BACKLOG L4).

name: OPSEC-gate

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'audit/**'
      - 'raw/**'
      - 'stab/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  egress-gate:
    name: Statisk egress-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Gate + självtest
        run: |
          node verktyg/egress-gate.js
          node verktyg/egress-gate.js --selftest

  hardened-invariant:
    name: Härdat läge-invarianten
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installera Playwright + Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      - name: Kör invariant-testet (server + deny-proxy + browser)
        run: node test/opsec/run.js

  hardened-sweep:
    name: Härdat-svep över alla sidor
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Installera Playwright + Chromium
        run: |
          npm i --no-save playwright
          npx playwright install --with-deps chromium
      # Laddar varje app-sida i härdat läge bakom deny-proxyn, i BÅDA lägena:
      # med kontrollerande service worker och utan. Det senare är där de tre
      # senaste läckorna fanns — minikartan, kartmodalen och PMTiles-headern —
      # samtliga upptäckta efter att invariant-testet redan var grönt.
      - name: Kör svepet (38 sidor × med/utan service worker)
        run: node test/opsec/run-sweep.js
      # Race: paketkollen passerar → paketet försvinner → headern läses ändå.
      # Var en verklig läcka (2 CONNECT mot R2) tills spärren flyttades före
      # detectKind(). Deterministiskt, inte timing-beroende.
      - name: Kör race-testet (atomisk aktivering)
        run: node test/opsec/run-race.js
